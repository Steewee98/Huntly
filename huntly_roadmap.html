<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huntly — Roadmap 6 Mesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #020508;
    --bg-card: #0a0f14;
    --bg-card-hover: #0e151c;
    --border: #1a2230;
    --text: #e8ecf1;
    --text-muted: #6b7a8d;
    --text-dim: #3a4a5c;
    --accent: #4F6EF7;
    --month1: #4F6EF7;
    --month2: #7B61FF;
    --month3: #00A5E5;
    --month4: #00D4E5;
    --month5: #00E5A0;
    --month6: #E56BFF;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    position: relative;
  }

  /* ── HEADER ── */
  .header {
    text-align: center;
    margin-bottom: 56px;
    position: relative;
  }

  .header-date {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 6px;
  }

  .header h1 span {
    background: linear-gradient(135deg, var(--month1), var(--month2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-sub {
    font-size: 14px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  /* ── GLOBAL PROGRESS ── */
  .global-progress {
    margin-bottom: 56px;
    padding: 28px 32px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    position: relative;
    overflow: hidden;
  }

  .global-progress::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, var(--month1), var(--month3), var(--month5), var(--month6));
    opacity: 0.6;
  }

  .global-progress-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }

  .global-progress-label {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .global-progress-count {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
  }

  .global-progress-count span { color: var(--accent); }

  .progress-track {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--month1), var(--month3), var(--month6));
    transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    width: 0%;
  }

  /* ── TIMELINE ── */
  .timeline {
    position: relative;
    padding-left: 0;
  }

  .timeline::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: 23px;
    width: 1px;
    background: linear-gradient(
      180deg,
      var(--month1) 0%,
      var(--month2) 16%,
      var(--month3) 33%,
      var(--month4) 50%,
      var(--month5) 66%,
      var(--month6) 83%,
      transparent 100%
    );
    opacity: 0.3;
  }

  /* ── MONTH BLOCK ── */
  .month-block {
    position: relative;
    padding-left: 64px;
    margin-bottom: 32px;
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .month-block:nth-child(1) { animation-delay: 0.1s; }
  .month-block:nth-child(2) { animation-delay: 0.2s; }
  .month-block:nth-child(3) { animation-delay: 0.3s; }
  .month-block:nth-child(4) { animation-delay: 0.4s; }
  .month-block:nth-child(5) { animation-delay: 0.5s; }
  .month-block:nth-child(6) { animation-delay: 0.6s; }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .month-dot {
    position: absolute;
    left: 14px; top: 28px;
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid var(--month-color, var(--accent));
    background: var(--bg);
    z-index: 2;
    transition: all 0.4s ease;
  }

  .month-block.complete .month-dot {
    background: var(--month-color, var(--accent));
    box-shadow: 0 0 16px color-mix(in srgb, var(--month-color, var(--accent)) 40%, transparent);
  }

  .month-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
  }

  .month-block.complete .month-card {
    border-color: color-mix(in srgb, var(--month-color, var(--accent)) 40%, transparent);
    box-shadow: 0 0 40px -10px color-mix(in srgb, var(--month-color, var(--accent)) 10%, transparent);
  }

  .month-header {
    padding: 24px 28px 20px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .month-header:hover { background: var(--bg-card-hover); }

  .month-number {
    position: absolute;
    right: 20px; top: 50%;
    transform: translateY(-50%);
    font-family: 'Playfair Display', serif;
    font-size: 96px;
    font-weight: 900;
    color: var(--month-color, var(--accent));
    opacity: 0.04;
    line-height: 1;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .month-header:hover .month-number { opacity: 0.07; }

  .month-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--month-color, var(--accent));
    margin-bottom: 4px;
  }

  .month-title {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .month-objective {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .month-meta {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .month-progress-bar {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .month-progress-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--month-color, var(--accent));
    transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    width: 0%;
  }

  .month-progress-text {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .month-chevron {
    color: var(--text-dim);
    transition: transform 0.3s ease, color 0.3s ease;
    flex-shrink: 0;
  }

  .month-block.open .month-chevron { transform: rotate(180deg); color: var(--month-color, var(--accent)); }

  /* ── MONTH BODY ── */
  .month-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .month-block.open .month-body { max-height: 1000px; }

  .checkpoints {
    list-style: none;
    padding: 0 28px 8px;
    border-top: 1px solid var(--border);
  }

  .checkpoint {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  .checkpoint:last-child { border-bottom: none; }
  .checkpoint:hover { opacity: 0.8; }

  .checkbox {
    width: 20px; height: 20px;
    border-radius: 5px;
    border: 1.5px solid var(--border);
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .checkbox svg { opacity: 0; transition: opacity 0.2s ease; }

  .checkpoint.checked .checkbox {
    background: var(--month-color, var(--accent));
    border-color: var(--month-color, var(--accent));
  }

  .checkpoint.checked .checkbox svg { opacity: 1; }

  .checkpoint-text {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
    transition: color 0.2s ease;
    padding-top: 1px;
  }

  .checkpoint.checked .checkpoint-text {
    color: var(--text-dim);
    text-decoration: line-through;
    text-decoration-color: var(--text-dim);
  }

  .complete-banner {
    padding: 0 28px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, padding 0.4s ease;
  }

  .month-block.complete .complete-banner {
    max-height: 60px;
    padding: 12px 28px 16px;
  }

  .complete-banner-inner {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--month-color, var(--accent));
    padding: 10px 16px;
    background: color-mix(in srgb, var(--month-color, var(--accent)) 8%, transparent);
    border-radius: 8px;
  }

  /* ── RESET ── */
  .reset-section {
    text-align: center;
    margin-top: 48px;
  }

  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.2s ease;
  }

  .reset-btn:hover {
    border-color: var(--text-muted);
    color: var(--text-muted);
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="header-date" id="today-date"></div>
    <h1>Huntly <span>Roadmap</span></h1>
    <div class="header-sub">Piano Operativo &mdash; 6 Mesi</div>
  </div>

  <div class="global-progress">
    <div class="global-progress-header">
      <div class="global-progress-label">Progresso Totale</div>
      <div class="global-progress-count"><span id="global-done">0</span> / <span id="global-total">0</span></div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="global-fill"></div>
    </div>
  </div>

  <div class="timeline" id="timeline"></div>

  <div class="reset-section">
    <button class="reset-btn" onclick="resetAll()">Reset tutto</button>
  </div>

</div>

<script>
const MONTHS = [
  {
    num: 1,
    label: 'Mese 1 — Maggio 2026',
    title: 'Lancio Beta',
    color: '#4F6EF7',
    objective: 'Portare Huntly online e trovare i primi 10 utenti di prova',
    checks: [
      'Deploy definitivo su huntlyrecruiting.io funzionante',
      'Variabili d\'ambiente Railway tutte configurate',
      'Stripe integrato — pagamenti Pro e Business attivi',
      'Feature gating piani verificato e imperforabile',
      'Privacy Policy e Terms of Service pubblicati',
      'Landing page live con banner cookie',
      'Identificare 10 profili target per beta gratuito (recruiter, HR manager, consulenti)',
      'Inviare 10 messaggi di invito beta personalizzati con Huntly stesso',
      'Almeno 5 beta tester attivi che usano il prodotto',
      'Primo feedback strutturato raccolto (form Google o simile)'
    ]
  },
  {
    num: 2,
    label: 'Mese 2 — Giugno 2026',
    title: 'Iterazione',
    color: '#7B61FF',
    objective: 'Migliorare il prodotto dai feedback e acquisire i primi paganti',
    checks: [
      'Analisi feedback beta — lista bug e miglioramenti prioritizzata',
      'Top 3 problemi emersi dal feedback risolti',
      'Email transazionali attive (benvenuto, reset password)',
      'Export CSV candidati implementato (piano Pro/Business)',
      'Sentry configurato per error monitoring in produzione',
      'Primi 3 utenti paganti acquisiti',
      'Almeno 2 testimonianze o recensioni raccolte dai beta',
      'Post LinkedIn su lancio Huntly pubblicato',
      'Prima revenue ricorrente mensile registrata'
    ]
  },
  {
    num: 3,
    label: 'Mese 3 — Luglio 2026',
    title: 'Visibilità',
    color: '#00A5E5',
    objective: 'Costruire presenza pubblica e raggiungere 20 utenti paganti',
    checks: [
      'Piano editoriale LinkedIn definito — 2 post/settimana',
      'Primi 8 post LinkedIn pubblicati su Huntly',
      'Outreach attivo con Huntly: 20 profili/settimana contattati',
      'Prima call esplorativa con potenziale cliente enterprise',
      'Case study scritto con dati reali di un beta tester',
      '20 utenti paganti attivi',
      'MRR €500+ raggiunto',
      'Staging environment Railway configurato',
      'Dominio email professionale configurato (es. info@huntlyrecruiting.io)'
    ]
  },
  {
    num: 4,
    label: 'Mese 4 — Agosto 2026',
    title: 'Crescita',
    color: '#00D4E5',
    objective: 'Automatizzare l\'acquisizione e integrare SceneAI',
    checks: [
      'SceneAI integrato in Huntly per generazione video LinkedIn',
      'Pipeline outreach semi-automatica configurata',
      'Primo video AI generato con SceneAI e pubblicato su LinkedIn',
      'Referral program semplice attivo (sconto per chi porta un amico)',
      '50 utenti paganti attivi',
      'MRR €1.500+ raggiunto',
      'Analisi canale acquisizione — qual è il più efficace',
      'Prima partnership con agenzia recruiting formalizzata',
      'Dashboard analytics avanzata per utenti Business'
    ]
  },
  {
    num: 5,
    label: 'Mese 5 — Settembre 2026',
    title: 'Espansione',
    color: '#00E5A0',
    objective: 'Raggiungere 100 utenti e valutare piano Enterprise',
    checks: [
      'Piano Enterprise / white label definito e prezzato',
      'Primo cliente Enterprise acquisito',
      'API pubblica Huntly documentata e disponibile',
      '100 utenti paganti attivi',
      'MRR €3.000+ raggiunto',
      'Testimonianze video da almeno 3 clienti raccolte',
      'Valutazione espansione mercato (Spagna o Francia)',
      'Primo articolo su media di settore (recruiting, HR tech)',
      'Tasso di churn mensile sotto il 5%'
    ]
  },
  {
    num: 6,
    label: 'Mese 6 — Ottobre 2026',
    title: 'Consolidamento',
    color: '#E56BFF',
    objective: 'Consolidare la posizione e pianificare i prossimi 6 mesi',
    checks: [
      'Analisi completa revenue per canale e piano completata',
      'Canale principale identificato e budget raddoppiato',
      'Canale meno performante ridotto o eliminato',
      '150+ utenti paganti attivi',
      'MRR €5.000+ raggiunto',
      'Team: almeno 1 collaboratore part-time (supporto clienti o sviluppo)',
      'Roadmap mesi 7-12 definita con obiettivi chiari',
      'Valutazione investimento esterno o bootstrap continuato',
      'Primo bilancio annuale Huntly completato'
    ]
  }
];

const STORAGE_KEY = 'huntly_roadmap_v1';
let state = {};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : {};
  } catch { state = {}; }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getCheckKey(mi, ci) { return `m${mi}_c${ci}`; }
function isChecked(mi, ci) { return !!state[getCheckKey(mi, ci)]; }

function toggleCheck(mi, ci) {
  const key = getCheckKey(mi, ci);
  state[key] = !state[key];
  saveState();
  updateUI();
}

function buildTimeline() {
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';

  MONTHS.forEach((m, mi) => {
    const block = document.createElement('div');
    block.className = 'month-block';
    block.style.setProperty('--month-color', m.color);
    block.dataset.month = mi;

    const checksHtml = m.checks.map((txt, ci) => `
      <li class="checkpoint" data-m="${mi}" data-c="${ci}">
        <div class="checkbox">
          <svg viewBox="0 0 12 12" fill="none"><path d="M2 6.5L4.5 9L10 3" stroke="#020508" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="checkpoint-text">${txt}</div>
      </li>
    `).join('');

    block.innerHTML = `
      <div class="month-dot"></div>
      <div class="month-card">
        <div class="month-header" data-toggle="${mi}">
          <div class="month-number">${m.num}</div>
          <div class="month-label">${m.label}</div>
          <div class="month-title">${m.title}</div>
          <div class="month-objective">${m.objective}</div>
          <div class="month-meta">
            <div class="month-progress-bar"><div class="month-progress-fill" id="mpf-${mi}"></div></div>
            <div class="month-progress-text" id="mpt-${mi}">0/${m.checks.length}</div>
            <div class="month-chevron"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          </div>
        </div>
        <div class="month-body">
          <ul class="checkpoints">${checksHtml}</ul>
          <div class="complete-banner">
            <div class="complete-banner-inner">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Mese completato
            </div>
          </div>
        </div>
      </div>
    `;

    tl.appendChild(block);
  });

  document.querySelectorAll('[data-toggle]').forEach(h => {
    h.addEventListener('click', () => {
      h.closest('.month-block').classList.toggle('open');
    });
  });

  document.querySelectorAll('.checkpoint').forEach(cp => {
    cp.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleCheck(+cp.dataset.m, +cp.dataset.c);
    });
  });
}

function updateUI() {
  let globalDone = 0, globalTotal = 0;

  MONTHS.forEach((m, mi) => {
    let done = 0;
    m.checks.forEach((_, ci) => {
      const checked = isChecked(mi, ci);
      if (checked) done++;
      const cpEl = document.querySelector(`.checkpoint[data-m="${mi}"][data-c="${ci}"]`);
      if (cpEl) cpEl.classList.toggle('checked', checked);
    });

    globalDone += done;
    globalTotal += m.checks.length;

    const pct = m.checks.length ? (done / m.checks.length * 100) : 0;
    const fill = document.getElementById(`mpf-${mi}`);
    const text = document.getElementById(`mpt-${mi}`);
    if (fill) fill.style.width = pct + '%';
    if (text) text.textContent = `${done}/${m.checks.length}`;

    const block = document.querySelector(`.month-block[data-month="${mi}"]`);
    if (block) block.classList.toggle('complete', done === m.checks.length && m.checks.length > 0);
  });

  document.getElementById('global-done').textContent = globalDone;
  document.getElementById('global-total').textContent = globalTotal;
  const gPct = globalTotal ? (globalDone / globalTotal * 100) : 0;
  document.getElementById('global-fill').style.width = gPct + '%';
}

function resetAll() {
  if (!confirm('Sei sicuro di voler resettare tutti i progressi?')) return;
  state = {};
  saveState();
  updateUI();
}

function setDate() {
  const d = new Date();
  const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  document.getElementById('today-date').textContent = d.toLocaleDateString('it-IT', opts);
}

loadState();
buildTimeline();
updateUI();
setDate();

(() => {
  for (let mi = 0; mi < MONTHS.length; mi++) {
    const allDone = MONTHS[mi].checks.every((_, ci) => isChecked(mi, ci));
    if (!allDone) {
      const block = document.querySelector(`.month-block[data-month="${mi}"]`);
      if (block) block.classList.add('open');
      break;
    }
  }
})();
</script>

</body>
</html>
